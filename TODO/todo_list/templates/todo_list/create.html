<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Todo Item</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }
    /* Glassmorphism effect */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }
    input, select, textarea {
      border: none;
      border-bottom: 2px solid #a5b4fc;
      background: transparent;
      padding: 0.5rem 0;
      width: 100%;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 600;
      color: #3730a3;
      font-size: 1rem;
    }
    p {
      margin-top: 0.75rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-200 via-blue-100 to-pink-100">

  <div class="glass max-w-lg w-full p-10 flex flex-col items-center">
    <div class="flex flex-col items-center mb-8">
      <span class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 shadow-lg mb-3">
        <svg class="w-10 h-10 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </span>
      <h1 class="text-4xl font-bold text-indigo-700 tracking-wide mb-1 drop-shadow">New Todo</h1>
      <p class="text-indigo-400 text-lg font-medium">Add something important to your day</p>
    </div>

    <form method="post" class="w-full space-y-7">
      {% csrf_token %}
      <div class="space-y-5">
        {{ form.as_p|safe }}
      </div>

      <button
        type="submit"
        class="w-full py-3 bg-gradient-to-r from-indigo-500 to-blue-400 text-white font-semibold rounded-xl shadow-lg hover:from-indigo-600 hover:to-blue-500 transition duration-300 text-lg"
      >
        Create Todo
      </button>
    </form>

    <div class="mt-8 w-full text-center">
      <p class="text-indigo-700 text-base font-medium italic">
        Are you sure you want to create this todo item?
      </p>
      <a
        href="{% url 'todo_list' %}"
        class="inline-block mt-5 px-6 py-2 bg-white/80 text-indigo-600 font-semibold rounded-lg shadow hover:bg-indigo-50 transition"
      >
        Cancel
      </a>
    </div>
  </div>
